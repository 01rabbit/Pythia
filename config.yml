# PYTHIA Configuration
# このファイルを編集して、あなただけのPYTHIAを定義してください

persona:
  role: "SOC Analyst"
  expertise_level: "senior"
  output_language: "ja"

scope:
  target_sectors:
    - "finance"
    - "government"
    - "critical_infrastructure"
  target_geos:
    - "JP"
    - "US"
  priority_groups:
    - "Lazarus Group"        # Phase 1 フォーカスグループ
  priority_techniques:
    - "T1566"                # Phishing
    - "T1059"                # Command and Scripting Interpreter
    - "T1190"                # Exploit Public-Facing Application
    - "T1068"                # Exploitation for Privilege Escalation

schedule:
  collect: "daily"           # レポート生成: Claude Code Routines (07:00 JST) / RSS・CVE機械収集: GitHub Actions daily-pipeline.yml (毎日 03:17 JST)
  normalize: "daily"         # Step 3.5 (01-normalize) — 日次パイプライン内
  baseline_update: "daily"   # Step 3.5 (02-baseline) — 日次パイプライン内
  forecast: "daily"          # Step 3.5 (03-forecast) — 日次パイプライン内
  verify: "twice_weekly"     # Claude Code Routines (火・木 12:00 JST) — GitHub Actions: weekly-verify.yml は事前リマインドIssueのみ

output:
  format: "plaintext+json"
  detail_level: "standard"
  include_recommendations: true

forecast:
  alert_threshold_sigma: 2.0
  caution_threshold_sigma: 1.0
  confidence_weight: true
  max_forecasts_per_day: 2   # 03-forecast.md の Step D に準拠

phase:
  current: 1
  config_file: "forecaster/phase1-config.json"
  focus_group: "Lazarus Group"
  next_group_candidate: "Volt Typhoon"

# ウォッチリスト（官側・運用者が指定する監視対象。2026-11-06 追加・第1段階）
# 該当する CVE / 記事は採用条件（pipeline-1-cve.md A〜H / pipeline-1b-apt.md P〜W）を
# 満たさなくても**無条件で採用**し、優先度は Step 3 の重みづけで評価する。
# - Step 0.7: scripts/nvd_window_sweep.py が NVD 窓内公開（CVSS 閾値に関係なく）と
#   KEV 窓内追加から該当分を母集団へ加える（突合ゲートの対象になる）
# - Step 0.8: scripts/watchlist_scan.py が RSS 機械収集 raw を走査し Step 1b / 2 へ渡す
# 照合は大文字小文字を無視した部分一致。別名・表記ゆれはここに列挙する。
# scope.priority_groups は actors に自動的に含まれる。空リストなら該当なし（機構は常時有効）。
watchlist:
  cves: []                   # 例: "CVE-2026-12345"（NVD 窓内の公開・更新を CVSS を問わず拾う）
  products: []               # 例: "Ivanti Connect Secure"（NVD 説明文・CPE・KEV の vendor/product と照合）
  actors: []                 # 例: "Volt Typhoon", "APT41"（記事のタイトル・要約と照合）
  topics: []                 # 例: "defense industrial base", "防衛産業", "重要インフラ"

# 周辺諸国（Section 5・2026-11-06 追加・第2段階）
# 要件「わが国周辺諸国に関するサイバー関連活動・政策・組織・企業の情報」と
# 「サイバーと非サイバー情報（国家戦略・政治動向・軍と組織）の関連分析」に対応する層。
# ★予報の入力層から分離した『報告専用』の文脈層であり、観測（forecaster/observations/）・
#   ベースライン・base_rate には一切入れない。既存の geopolitical_signal の経路
#   （pipeline-1b-apt.md「地政学先行指標」）はこの設定の影響を受けない。
# 語彙の定義は neighbor/states.json、どの国を有効にするかはここで選ぶ（国コード）。
# primary = 主たる周辺諸国 / regional = 地域文脈（被害・政策・企業の文脈で見る国）。
# gate_min_relevance: Step 2c で『採用または理由付き除外』を必須とする候補の下限
# （high = 国名がタイトルに出現 / medium = 要約に出現。scripts/neighbor_scan.py 参照）。
neighbor_states:
  primary: ["CN", "RU", "KP"]
  regional: ["KR", "TW"]
  gate_min_relevance: "high"
