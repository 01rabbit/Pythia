# PYTHIA Configuration
# このファイルを編集して、あなただけのPYTHIAを定義してください

persona:
  role: "SOC Analyst"
  expertise_level: "senior"
  output_language: "ja"

scope:
  target_sectors:
    - "finance"
    - "government"
    - "critical_infrastructure"
  target_geos:
    - "JP"
    - "US"
  priority_groups:
    - "Lazarus Group"        # Phase 1 フォーカスグループ
  priority_techniques:
    - "T1566"                # Phishing
    - "T1059"                # Command and Scripting Interpreter
    - "T1190"                # Exploit Public-Facing Application
    - "T1068"                # Exploitation for Privilege Escalation

schedule:
  collect: "daily"           # GitHub Actions: daily-pipeline.yml (07:00 JST)
  normalize: "daily"         # Step 3.5 (01-normalize) — 日次パイプライン内
  baseline_update: "daily"   # Step 3.5 (02-baseline) — 日次パイプライン内
  forecast: "daily"          # Step 3.5 (03-forecast) — 日次パイプライン内
  verify: "twice_weekly"     # GitHub Actions: weekly-verify.yml (火・木 12:00 JST)

output:
  format: "markdown"
  detail_level: "standard"
  include_recommendations: true

forecast:
  alert_threshold_sigma: 2.0
  caution_threshold_sigma: 1.0
  confidence_weight: true
  max_forecasts_per_day: 2   # 03-forecast.md の Step D に準拠

phase:
  current: 1
  config_file: "forecaster/phase1-config.json"
  focus_group: "Lazarus Group"
  next_group_candidate: "Volt Typhoon"
