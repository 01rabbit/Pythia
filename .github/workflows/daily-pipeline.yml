name: Daily Feed Collection

on:
  schedule:
    # 06:00 JST = 21:00 UTC (前日) — Routines実行 (07:00 JST) より1時間前に収集完了させる
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r security-intel-collector/requirements.txt

      - name: Run RSS feed collector
        run: |
          cd security-intel-collector
          python watcher.py

      - name: Commit collected feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add security-intel-collector/data/
          if git diff --cached --quiet; then
            echo "No new feeds collected."
          else
            DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
            git commit -m "collect: rss feeds ${DATE}"
            git push
          fi
