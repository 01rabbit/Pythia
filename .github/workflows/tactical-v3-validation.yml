name: Tactical Forecaster v3 Validation

on:
  pull_request:
    paths:
      - 'forecaster/**'
      - 'scripts/**tactical**'
      - 'scripts/build_event_store.py'
      - 'scripts/build_case_library.py'
      - 'scripts/build_episodes.py'
      - 'scripts/generate_tactical_candidates.py'
      - 'scripts/build_reference_rates.py'
      - 'scripts/build_promotion_summary.py'
      - 'scripts/record_source_coverage.py'
      - 'scripts/check_verification_health.py'
      - 'scripts/source_channels.py'
      - 'scripts/json_schema_lite.py'
      - 'scripts/collect_channel_evidence.py'
      - 'scripts/validate_observations.py'
      - 'SKILL.md'
      - 'scripts/validate_forecasts.py'
      - 'scripts/validate_temporal_integrity.py'
      - 'scripts/snapshot_sources.py'
      - 'scripts/test_phase0_measurement.py'
      - '.github/workflows/tactical-v3-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 変更された成果物の日付を base との差分から拾うため全履歴が要る
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile tactical pipeline
        run: python3 -m py_compile scripts/*.py
      - name: Run tactical regression tests
        run: |
          python3 scripts/test_tf1_shadow.py
          python3 scripts/test_tactical_v3.py
          python3 scripts/validate_tactical_schemas.py
      - name: Validate observations against the schema
        run: python3 scripts/validate_observations.py
      - name: Channel feed registry must be consistent
        # 宣言フィードのホストが source-channels.json に、正しいチャネルで
        # 登録されているかを検査する（取得はしない・ネット不使用）。
        run: python3 scripts/collect_channel_evidence.py --verify-registry
      - name: Phase 0 gates
        # 時刻順序・予報スキーマの fail-closed ゲート本体。これまで CI では
        # 一度も実行されておらず、違反はマージ時点で検出できなかった。
        run: |
          python3 scripts/validate_forecasts.py
          python3 scripts/validate_temporal_integrity.py --all
          python3 scripts/test_phase0_measurement.py
      - name: Consistency checks on artifacts this PR changes
        # ★全期間ではなく「この PR が触れた日付」だけを検査する。
        #   既存履歴にはレポート整合11件・旧予報整合12件が残っているが、
        #   発行済みの判定を遡及改変しない方針（原則D・教訓12）のため
        #   歴史を赤にせず、新規・変更分だけをゲートする。
        #
        # ★2チェックは対象パスが異なるため日付抽出も分ける（Issue #184）。
        #   check_report_consistency.py は outputs/ のJSON×派生テキストの整合を見る
        #   ので outputs/ の変更日付だけを対象にする。check_forecast_consistency.py は
        #   forecaster/forecasts/daily/*.json の内部整合（hit_criteria等）を見るので
        #   forecaster/forecasts/ の変更日付だけを対象にする。以前は両者を
        #   forecaster/observations/ まで含めた共通の日付集合で回していたため、
        #   検証ステージが observations の verified_outcome だけを書き換えたPRでも
        #   その日の予報ファイルが既知のベースライン違反（Issue #162）を持っていれば
        #   無関係にCIが赤くなっていた（実例: PR #183）。
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            echo "PR コンテキストではないので比較対象がない（workflow_dispatch 等）"
            exit 0
          fi
          # ★grep は無一致で exit 1 を返す。GitHub Actions の既定は bash -e なので
          #   `|| true` が無いとこのステップ自体が落ちる。
          report_dates=$(git diff --name-only "$base"...HEAD -- outputs \
                  | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u || true)
          forecast_dates=$(git diff --name-only "$base"...HEAD -- forecaster/forecasts \
                  | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u || true)
          if [ -z "$report_dates" ] && [ -z "$forecast_dates" ]; then
            echo "この PR は日次成果物（outputs / forecaster/forecasts）を変更していない"
            exit 0
          fi
          rc=0
          for d in $report_dates; do
            echo "--- report $d ---"
            python3 scripts/check_report_consistency.py --date "$d" || rc=1
          done
          for d in $forecast_dates; do
            echo "--- forecast $d ---"
            python3 scripts/check_forecast_consistency.py --date "$d" || rc=1
          done
          exit $rc
      - name: Validate committed tactical artifacts
        run: |
          python3 scripts/validate_tactical_integrity.py --all
          python3 scripts/validate_transition_claims.py --all
          python3 scripts/build_promotion_summary.py --as-of-utc 2026-08-29T14:30:00Z --check
          python3 scripts/validate_model_promotion.py
      - name: Verification must actually score
        run: |
          python3 scripts/verify_tactical_forecasts.py --all --json > /tmp/tactical-verification.json
          python3 scripts/check_verification_health.py --from-json /tmp/tactical-verification.json
      - name: Ensure reference rates are reproducible
        run: |
          cp forecaster/models/reference-rates.json /tmp/reference-rates.before.json
          python3 scripts/build_reference_rates.py
          diff -u /tmp/reference-rates.before.json forecaster/models/reference-rates.json
